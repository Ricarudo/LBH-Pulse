name: pulse-production

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Runtime database URL is required}
  PULSE_DB_APP_USER: ${PULSE_DB_APP_USER:?Runtime database user is required}
  PULSE_PUBLIC_URL: ${PULSE_PUBLIC_URL:?HTTPS public URL is required}
  PULSE_SESSION_SECRET: ${PULSE_SESSION_SECRET:?Session secret is required}
  PULSE_SECURITY_PEPPER: ${PULSE_SECURITY_PEPPER:?Security pepper is required}
  PULSE_SETUP_TOKEN: ${PULSE_SETUP_TOKEN:-}
  PULSE_SESSION_TTL_MINUTES: ${PULSE_SESSION_TTL_MINUTES:-480}
  PULSE_SESSION_IDLE_MINUTES: ${PULSE_SESSION_IDLE_MINUTES:-30}
  PULSE_COOKIE_SECURE: ${PULSE_COOKIE_SECURE:-true}
  PULSE_COOKIE_SAME_SITE: ${PULSE_COOKIE_SAME_SITE:-strict}
  PULSE_TRUST_PROXY_HOPS: ${PULSE_TRUST_PROXY_HOPS:-2}
  PULSE_ALLOWED_ORIGINS: ${PULSE_ALLOWED_ORIGINS:?Allowed origin is required}
  PULSE_AUTH_RATE_LIMIT_ENABLED: ${PULSE_AUTH_RATE_LIMIT_ENABLED:-true}
  PULSE_LOGIN_WINDOW_SECONDS: ${PULSE_LOGIN_WINDOW_SECONDS:-900}
  PULSE_LOGIN_ACCOUNT_MAX_ATTEMPTS: ${PULSE_LOGIN_ACCOUNT_MAX_ATTEMPTS:-5}
  PULSE_LOGIN_IP_MAX_ATTEMPTS: ${PULSE_LOGIN_IP_MAX_ATTEMPTS:-25}
  PULSE_LOGIN_LOCKOUT_SECONDS: ${PULSE_LOGIN_LOCKOUT_SECONDS:-900}
  PULSE_REQUIRE_CREDENTIAL_CONTAINMENT: ${PULSE_REQUIRE_CREDENTIAL_CONTAINMENT:-true}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?Document bucket is required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?MinIO application key is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?MinIO application secret is required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-180000}
  DOCUMENT_TEMP_DIR: /tmp/pulse-uploads
  PULSE_AUDIT_RETENTION_DAYS: ${PULSE_AUDIT_RETENTION_DAYS:-365}
  PULSE_OPERATIONAL_RETENTION_DAYS: ${PULSE_OPERATIONAL_RETENTION_DAYS:-730}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.14-alpine}
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?PostgreSQL admin user is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?PostgreSQL admin password is required}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    init: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MinIO root user is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO root password is required}
    volumes:
      - minio-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  minio-init:
    image: pulse-minio-init:${PULSE_RELEASE_TAG:?Release tag is required}
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      args:
        MINIO_MC_IMAGE: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MinIO root user is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO root password is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?MinIO application key is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?MinIO application secret is required}
      S3_BUCKET: ${S3_BUCKET:?Document bucket is required}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      minio:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  clamav:
    image: pulse-clamav:${PULSE_RELEASE_TAG:?Release tag is required}
    platform: ${CLAMAV_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/clamav/Dockerfile
      args:
        CLAMAV_BASE_IMAGE: ${CLAMAV_BASE_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    init: true
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    security_opt: ["no-new-privileges:true"]

  api:
    image: pulse-api:${PULSE_RELEASE_TAG:?Release tag is required}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=1000,gid=1000
    environment: *api-environment
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  web:
    image: pulse-web:${PULSE_RELEASE_TAG:?Release tag is required}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        PULSE_API_URL: http://api:3000
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=1000,gid=1000
      - /workspace/apps/web/.next/cache:size=256m,mode=0770,uid=1000,gid=1000
    environment:
      NODE_ENV: production
      PULSE_API_URL: http://api:3000
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4300/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  gateway:
    image: pulse-gateway:${PULSE_RELEASE_TAG:?Release tag is required}-${PULSE_CADDY_TARGET:?Set internal or public}
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      target: ${PULSE_CADDY_TARGET:?Set internal or public}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      PULSE_HOSTNAME: ${PULSE_HOSTNAME:?Caddy hostname is required}
      PULSE_CADDY_EMAIL: ${PULSE_CADDY_EMAIL:-operator@example.invalid}
    ports:
      - "${PULSE_HTTP_PORT:-80}:80"
      - "${PULSE_HTTPS_PORT:-443}:443"
      - "${PULSE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m,mode=1770
    networks: [edge, frontend]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  frontend:
    internal: true
  backend:
    internal: true

volumes:
  postgres-data:
    name: ${PULSE_POSTGRES_VOLUME:?PostgreSQL volume name is required}
  minio-data:
    name: ${PULSE_MINIO_VOLUME:?MinIO volume name is required}
  clamav-data:
  caddy-data:
  caddy-config:
