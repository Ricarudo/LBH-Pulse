name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      bootstrap_packages:
        description: Publish commit-SHA images so an owner can make the GHCR packages public
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" == "${GITHUB_SHA}" ]] || { echo "Tag does not point to the checked-out commit." >&2; exit 1; }
            data=$(node scripts/release/validate-version.mjs "${GITHUB_REF_NAME}")
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # JavaScript template literals are intentionally quoted from Bash.
            # shellcheck disable=SC2016
            data=$(node -e 'const p=require("./package.json"); const [a,b]=p.version.split("."); process.stdout.write(JSON.stringify({version:p.version,minor:`${a}.${b}`}))')
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(jq -r .version <<<"$data")" >> "$GITHUB_OUTPUT"
          echo "minor=$(jq -r .minor <<<"$data")" >> "$GITHUB_OUTPUT"

  release-gates:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  resolve-bases:
    needs: validate
    if: github.ref_type == 'tag' || inputs.bootstrap_packages
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.resolve.outputs.node }}
      minio_mc: ${{ steps.resolve.outputs.minio_mc }}
      clamav: ${{ steps.resolve.outputs.clamav }}
      caddy: ${{ steps.resolve.outputs.caddy }}
      alpine: ${{ steps.resolve.outputs.alpine }}
      docker_cli: ${{ steps.resolve.outputs.docker_cli }}
    steps:
      - id: resolve
        name: Resolve linux/amd64 build bases and third-party services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base-digests
          resolve() {
            key=$1
            image=$2
            docker pull --platform linux/amd64 "$image"
            reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            echo "$key=$reference" >> "$GITHUB_OUTPUT"
          }
          resolve node node:24-alpine
          resolve minio_mc minio/mc:RELEASE.2025-04-16T18-13-26Z
          resolve clamav clamav/clamav:stable
          resolve caddy caddy:2.11.4-alpine
          resolve alpine alpine:3.22.1
          resolve docker_cli docker:29.3.0-cli
          resolve postgres postgres:16.14-alpine
          resolve minio minio/minio:RELEASE.2025-04-22T22-12-26Z
          printf '{"component":"postgres","reference":"%s"}\n' "$(grep '^postgres=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" > base-digests/postgres.json
          printf '{"component":"minio","reference":"%s"}\n' "$(grep '^minio=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" > base-digests/minio.json
          printf '{"component":"minioMc","reference":"%s"}\n' "$(grep '^minio_mc=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" > base-digests/minioMc.json
          jq -n \
            --arg node "$(grep '^node=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" \
            --arg minioMc "$(grep '^minio_mc=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" \
            --arg clamav "$(grep '^clamav=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" \
            --arg caddy "$(grep '^caddy=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" \
            --arg alpine "$(grep '^alpine=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" \
            '{node:$node,minioMc:$minioMc,clamav:$clamav,caddy:$caddy,alpine:$alpine}' > base-digests/build-bases.json
      - uses: actions/upload-artifact@v4
        with:
          name: base-digests
          path: base-digests/*.json
          if-no-files-found: error

  publish-images:
    needs: [validate, resolve-bases]
    if: github.ref_type == 'tag' || inputs.bootstrap_packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: updater
            image: pulse-updater
            file: docker/updater/Dockerfile
            target: ""
            suffix: ""
          - component: api
            image: pulse-api
            file: apps/api/Dockerfile
            target: production
            suffix: ""
          - component: web
            image: pulse-web
            file: apps/web/Dockerfile
            target: production
            suffix: ""
          - component: maintenance
            image: pulse-maintenance
            file: apps/api/Dockerfile
            target: maintenance
            suffix: ""
          - component: minioInit
            image: pulse-minio-init
            file: docker/minio/Dockerfile
            target: ""
            suffix: ""
          - component: clamav
            image: pulse-clamav
            file: docker/clamav/Dockerfile
            target: ""
            suffix: ""
          - component: backupCrypto
            image: pulse-backup-crypto
            file: docker/backup/Dockerfile
            target: ""
            suffix: ""
          - component: gatewayInternal
            image: pulse-gateway
            file: docker/caddy/Dockerfile
            target: internal
            suffix: -internal
          - component: gatewayPublic
            image: pulse-gateway
            file: docker/caddy/Dockerfile
            target: public
            suffix: -public
    steps:
      - uses: actions/checkout@v6
      - name: Embed release verification keys
        env:
          PULSE_RELEASE_PUBLIC_KEYS: ${{ vars.PULSE_RELEASE_PUBLIC_KEYS }}
        run: node scripts/release/prepare-trust-store.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse semantic-tag replacement
        if: needs.validate.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Exact release tags are immutable. The minor channel intentionally
          # advances from 0.1.0 to 0.1.1 and later patch releases.
          replacement_revision=$(jq -r '.replacesUnpublishedRevision // empty' "docs/releases/${{ needs.validate.outputs.version }}.json")
          if [[ -n "$replacement_revision" && ! "$replacement_revision" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Release metadata contains an invalid replacesUnpublishedRevision." >&2
            exit 1
          fi
          reference="ghcr.io/ricarudo/${{ matrix.image }}:${{ needs.validate.outputs.version }}${{ matrix.suffix }}"
          if docker pull --platform linux/amd64 "$reference" >/dev/null 2>&1; then
            revision=$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [[ "$revision" != "${{ github.sha }}" ]]; then
              if [[ -z "$replacement_revision" || "$revision" != "$replacement_revision" ]]; then
                echo "Refusing to replace existing release tag $reference from revision $revision." >&2
                exit 1
              fi
              echo "Replacing $reference from failed unpublished revision $revision."
            fi
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            NODE_BASE_IMAGE=${{ needs.resolve-bases.outputs.node }}
            MINIO_MC_IMAGE=${{ needs.resolve-bases.outputs.minio_mc }}
            CLAMAV_BASE_IMAGE=${{ needs.resolve-bases.outputs.clamav }}
            CADDY_BASE_IMAGE=${{ needs.resolve-bases.outputs.caddy }}
            ALPINE_BASE_IMAGE=${{ needs.resolve-bases.outputs.alpine }}
            DOCKER_CLI_IMAGE=${{ needs.resolve-bases.outputs.docker_cli }}
          push: true
          tags: |
            ghcr.io/ricarudo/${{ matrix.image }}:sha-${{ github.sha }}${{ matrix.suffix }}
            ${{ needs.validate.outputs.release == 'true' && format('ghcr.io/ricarudo/{0}:{1}{2}', matrix.image, needs.validate.outputs.version, matrix.suffix) || '' }}
            ${{ needs.validate.outputs.release == 'true' && format('ghcr.io/ricarudo/{0}:{1}{2}', matrix.image, needs.validate.outputs.minor, matrix.suffix) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.description=Pulse ${{ matrix.component }} production image
      - shell: bash
        run: |
          mkdir -p digest
          printf '{"component":"%s","reference":"ghcr.io/ricarudo/%s@%s"}\n' \
            '${{ matrix.component }}' '${{ matrix.image }}' '${{ steps.build.outputs.digest }}' \
            > 'digest/${{ matrix.component }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: digest/*.json
          if-no-files-found: error

  release-bundle:
    environment: release
    needs: [validate, release-gates, publish-images]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: release-digests
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: base-digests
          path: release-digests
      - run: >-
          node scripts/release/create-release-manifest.mjs
          --version '${{ needs.validate.outputs.version }}'
          --commit '${{ github.sha }}'
          --input release-digests
          --build-bases release-digests/build-bases.json
          --output release-bundle
          --managed true
      - name: Sign Docker deployment bundle
        env:
          PULSE_RELEASE_PUBLIC_KEYS: ${{ vars.PULSE_RELEASE_PUBLIC_KEYS }}
          PULSE_RELEASE_SIGNING_KEY: ${{ secrets.PULSE_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/release/prepare-trust-store.mjs
          node scripts/release/create-deployment-bundle.mjs --output release-bundle
          tar -czf pulse-docker-${{ needs.validate.outputs.version }}.tar.gz -C release-bundle .
      - name: Prove anonymous digest pulls
        shell: bash
        run: |
          docker logout ghcr.io || true
          jq -r '.images[]' release-bundle/release-manifest.json | while read -r image; do docker pull "$image"; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            release-bundle/*
            pulse-docker-*.tar.gz

  publish-docker-release:
    needs: [validate, release-bundle]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: assets
      - name: Require Linux and Windows qualification
        env:
          QUALIFIED: ${{ vars.PULSE_DOCKER_QUALIFIED_COMMIT }}
        run: test "$QUALIFIED" = "${{ github.sha }}"
      - name: Publish Docker release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' --verify-tag --draft --title 'Pulse ${{ needs.validate.outputs.version }}' --notes-file 'docs/releases/${{ needs.validate.outputs.version }}.md'
          gh release upload '${{ github.ref_name }}' assets/release-bundle/* assets/pulse-docker-*.tar.gz
          gh release edit '${{ github.ref_name }}' --draft=false
