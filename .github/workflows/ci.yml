name: CI

on:
  workflow_call:
  pull_request:
    branches: [main, master, develop, release/0.2.0]
  push:
    branches: [main, master, release/0.2.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Updater signature and interruption tests
        run: node --test services/updater/test/release.test.mts services/updater/test/engine.test.mts

      - name: Validate managed Docker configuration
        run: |
          docker compose -f services/updater/compose.test.yaml build image
          docker compose -f services/updater/compose.test.yaml run --rm config
          docker compose -f services/updater/compose.test.yaml run --rm config --test services/updater/test/publishing.test.mts

      - name: Validate maintenance routing and isolated updater restore
        run: |
          docker compose -f services/updater/compose.gateway-test.yaml run --rm tests
          docker compose -f services/updater/compose.operations-test.yaml build maintenance-image minio-init-image
          docker compose -f services/updater/compose.operations-test.yaml run --rm tests

      - name: Generate ephemeral CI secrets
        run: ./scripts/ci/create-env.sh .env.ci

      - name: Reject shipped credentials and secret fallbacks
        run: npm run verify:no-shipped-secrets

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production Compose policy
        run: npm run verify:production-config -- .env.ci

      - name: Build every production image
        run: >-
          docker compose --env-file .env.ci -f compose.production.yaml build
          api web gateway minio-init clamav

      - name: Build isolated release-check image
        run: docker compose --env-file .env.ci -f compose.ci.yaml build checks

      - name: Build maintenance and network-isolated backup images
        run: >-
          docker compose --env-file .env.ci
          -f compose.production.yaml -f compose.maintenance.yaml
          --profile maintenance --profile backup build db-roles backup-encrypt

      - name: Start isolated release stack
        run: >-
          docker compose --env-file .env.ci -f compose.ci.yaml up -d --build --wait
          --wait-timeout 360 postgres minio clamav initialize api web

      - name: Validate read-only reference data maintenance
        run: >-
          docker compose --project-name lbh-pulse-ci --env-file .env.ci
          -f compose.production.yaml -f compose.maintenance.yaml
          --profile maintenance run --no-deps --rm reference-data

      - name: Run release tests and reconciliation gates
        run: docker compose --env-file .env.ci -f compose.ci.yaml run --no-deps --rm checks

      - name: Typecheck updater
        run: docker compose --env-file .env.ci -f compose.ci.yaml run --no-deps --rm checks npx tsc -p services/updater/tsconfig.json

      - name: Validate encrypted PostgreSQL and MinIO restore
        run: ./scripts/ci/backup-restore.sh .env.ci

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.ci -f compose.ci.yaml logs --no-color

      - name: Remove CI resources
        if: always()
        run: |
          if [ -f .env.ci ]; then docker compose --env-file .env.ci -f compose.ci.yaml down -v --remove-orphans; fi
          docker compose -f services/updater/compose.gateway-test.yaml down -v --remove-orphans
          docker compose -f services/updater/compose.operations-test.yaml down -v --remove-orphans
          rm -f .env.ci
